services:
  - type: web
    runtime: static
    name: oshtu-schedule
    buildCommand: echo "static site, no build"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    routes:
      # прокси к Supabase через свой домен (работает, даже если *.supabase.co недоступен у провайдера)
      - type: rewrite
        source: /sb/*
        destination: https://pzdraaxgzphxennadrlu.supabase.co/*
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
