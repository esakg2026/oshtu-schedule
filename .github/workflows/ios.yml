name: iOS build

on:
  push:
    paths:
      - "ios-source.zip"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unpack iOS sources
        run: unzip -q ios-source.zip -d build-src

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: build-src/ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: build-src/ios
        run: |
          set -o pipefail
          xcodebuild -project OshtuSchedule.xcodeproj -target OshtuSchedule -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error|warning: .*Schedule|BUILD|\*\*" | tail -n 150

      - name: Package unsigned IPA
        working-directory: build-src/ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/OshtuSchedule.app Payload/
          ls Payload/OshtuSchedule.app/PlugIns
          zip -qry ../../OshtuSchedule-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OshtuSchedule-unsigned-ipa
          path: OshtuSchedule-unsigned.ipa
